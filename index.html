<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CircleWish — Coming Soon</title>
  <style>
    :root{
      --bg:#070A12;
      --text:#EAF0FF;
      --muted:rgba(234,240,255,.72);

      --ring:rgba(234,240,255,.22);
      --ringGlow: rgba(140,240,255,.12);

      --accent:#8CF0FF;
      --accent2:#B7A7FF;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background:
        radial-gradient(1200px 800px at 50% 35%, rgba(140,240,255,.08), transparent 55%),
        radial-gradient(900px 700px at 60% 65%, rgba(183,167,255,.10), transparent 55%),
        radial-gradient(700px 500px at 40% 60%, rgba(124,255,178,.06), transparent 60%),
        var(--bg);
      color:var(--text);
      overflow:hidden;
    }

    .wrap{
      min-height:100%;
      display:grid;
      place-items:center;
      padding:28px 18px;
      position:relative;
    }

    .card{
      width:min(980px, 96vw);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.10);
      border-radius:22px;
      box-shadow: 0 24px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.10);
      overflow:hidden;
      position:relative;
    }

    .card::before{
      content:"";
      position:absolute; inset:-2px;
      background:
        radial-gradient(600px 240px at 15% 10%, rgba(140,240,255,.18), transparent 60%),
        radial-gradient(520px 240px at 90% 30%, rgba(183,167,255,.16), transparent 60%),
        radial-gradient(520px 260px at 55% 110%, rgba(124,255,178,.10), transparent 65%);
      filter: blur(10px);
      opacity:.55;
      pointer-events:none;
    }

    .inner{
      position:relative;
      display:grid;
      grid-template-columns: 1.05fr .95fr;
      gap:26px;
      padding:34px;
      align-items:center;
    }

    @media (max-width: 860px){
      .inner{
        grid-template-columns: 1fr;
        padding:26px;
        gap:18px;
      }
    }

    /* Left */
    .brand{
      display:flex; align-items:center; gap:10px;
      font-weight:700; letter-spacing:.2px;
      color:rgba(234,240,255,.92);
      margin-bottom:14px;
    }
    .dot{
      width:10px;height:10px;border-radius:999px;
      background:linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 0 18px rgba(140,240,255,.38);
    }

    h1{
      margin:0 0 10px 0;
      font-size: clamp(26px, 3.2vw, 40px);
      line-height:1.12;
      letter-spacing:-.5px;
    }

    .caption{
      margin:0 0 14px 0;
      color:var(--muted);
      font-size: clamp(14px, 1.35vw, 16px);
      line-height:1.6;
      max-width:54ch;
    }

    /* Pills: desktop wrap, mobile grid aligned */
    .pillRow{
      display:flex;
      flex-wrap:wrap;
      gap:12px;                 /* a touch more spacing */
      margin-top:12px;
      align-items:flex-start;
    }

    .pill{
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      padding:9px 12px;         /* slightly more padding */
      border-radius:999px;
      font-size:12px;
      color: rgba(234,240,255,.78);
      display:flex; align-items:center; gap:8px;
      backdrop-filter: blur(8px);
      white-space:nowrap;
    }
    .pill .mini{
      width:7px;height:7px;border-radius:999px;background:rgba(234,240,255,.55);
      flex:0 0 auto;
    }

    @media (max-width: 520px){
      .pillRow{
        display:grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap:10px;
        width:100%;
      }
      .pill{
        width:100%;
        justify-content:center;
        white-space:normal;
        text-align:center;
      }
    }
    @media (max-width: 360px){
      .pillRow{ grid-template-columns: 1fr; }
    }

    /* Right hero */
    .hero{
      display:grid;
      place-items:center;
      position:relative;
      padding-top: 6px;
    }

    .orbitalWrap{
      display:grid;
      justify-items:center;
      gap:14px; /* note stays outside ring */
    }

    .orbital{
      width: 340px;
      height: 340px;
      display:grid;
      place-items:center;
      position:relative;
      transform: translateX(14px);
    }

    @media (max-width: 860px){
      .orbital{
        transform:none;
        width:min(360px, 88vw);
        height:auto;
        aspect-ratio:1/1;
      }
    }

    .spark{
      position:absolute; inset:-18px;
      border-radius:999px;
      background:
        radial-gradient(circle at 30% 25%, rgba(140,240,255,.18), transparent 45%),
        radial-gradient(circle at 75% 65%, rgba(183,167,255,.16), transparent 45%),
        radial-gradient(circle at 55% 85%, rgba(124,255,178,.10), transparent 50%);
      filter: blur(18px);
      opacity:.70;
      animation: floatGlow 8s ease-in-out infinite;
      z-index:0;
      pointer-events:none;
    }
    @keyframes floatGlow{
      0%,100%{ transform: translateY(0) scale(1); opacity:.58; }
      50%{ transform: translateY(-10px) scale(1.02); opacity:.86; }
    }

    .orbitSvg{
      width:100%;
      height:100%;
      z-index:1;
      filter: drop-shadow(0 0 22px var(--ringGlow));
    }

    .note{
      font-size:12px;
      color: rgba(234,240,255,.55);
      text-align:center;
      max-width: 46ch;
      padding: 0 10px;
      transform: translateX(14px);
    }
    @media (max-width: 860px){
      .note{ transform:none; }
    }

    @media (prefers-reduced-motion: reduce){
      .spark{ animation:none !important; }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="card" role="region" aria-label="CircleWish coming soon">
      <div class="inner">
        <div>
          <div class="brand">
            <span class="dot" aria-hidden="true"></span>
            <span>CircleWish</span>
          </div>

          <h1>Coming Soon</h1>
          <p class="caption">The platform that turns intent into impact.</p>

          <div class="pillRow" aria-label="Key ideas">
            <div class="pill"><span class="mini"></span>Wishes</div>
            <div class="pill"><span class="mini"></span>Circles</div>
            <div class="pill"><span class="mini"></span>Trust &amp; Score</div>
            <div class="pill"><span class="mini"></span>Real-world follow-through</div>
          </div>
        </div>

        <div class="hero">
          <div class="orbitalWrap">
            <div class="orbital" aria-hidden="true">
              <div class="spark"></div>

              <!-- One SVG: ring + star + 5 dots aligned to star tips -->
              <svg class="orbitSvg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <radialGradient id="aura" cx="50%" cy="45%" r="60%">
                    <stop offset="0%" stop-color="rgba(255,255,255,.10)"/>
                    <stop offset="65%" stop-color="rgba(140,240,255,.10)"/>
                    <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
                  </radialGradient>

                  <linearGradient id="dotGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="var(--accent)"/>
                    <stop offset="100%" stop-color="var(--accent2)"/>
                  </linearGradient>
                </defs>

                <!-- Ring: thicker so it dominates dots -->
                <circle cx="200" cy="200" r="160"
                        fill="none"
                        stroke="var(--ring)"
                        stroke-width="12"
                        opacity="0.96"/>

                <!-- Soft inner aura -->
                <circle cx="200" cy="200" r="120" fill="url(#aura)" opacity="0.9"/>

                <!-- Star (Wish) -->
                <path id="wishStar"
                      d="M200 118
                         L226 170
                         L284 178
                         L242 218
                         L252 276
                         L200 250
                         L148 276
                         L158 218
                         L116 178
                         L174 170 Z"
                      fill="rgba(255,255,255,.96)"
                      style="filter: drop-shadow(0 18px 30px rgba(0,0,0,.55));"/>

                <!-- Dots on ring at star tips (r reduced: 7 -> 6) -->
                <!-- Star tip angles: -90, -18, 54, 126, 198 degrees on r=160 -->
                <g>
                  <circle cx="200" cy="40" r="6" fill="url(#dotGrad)" opacity="0.15">
                    <!-- slight overlap feel: fast rise, gentle fall -->
                    <animate attributeName="opacity" values="0.12;1;0.22;0.12" dur="2.4s" begin="0s" repeatCount="indefinite"/>
                    <animate attributeName="r" values="5.5;8.5;6.2;5.5" dur="2.4s" begin="0s" repeatCount="indefinite"/>
                  </circle>

                  <circle cx="352.2" cy="150.6" r="6" fill="url(#dotGrad)" opacity="0.15">
                    <animate attributeName="opacity" values="0.12;1;0.22;0.12" dur="2.4s" begin="0.35s" repeatCount="indefinite"/>
                    <animate attributeName="r" values="5.5;8.5;6.2;5.5" dur="2.4s" begin="0.35s" repeatCount="indefinite"/>
                  </circle>

                  <circle cx="294.0" cy="329.4" r="6" fill="url(#dotGrad)" opacity="0.15">
                    <animate attributeName="opacity" values="0.12;1;0.22;0.12" dur="2.4s" begin="0.70s" repeatCount="indefinite"/>
                    <animate attributeName="r" values="5.5;8.5;6.2;5.5" dur="2.4s" begin="0.70s" repeatCount="indefinite"/>
                  </circle>

                  <circle cx="106.0" cy="329.4" r="6" fill="url(#dotGrad)" opacity="0.15">
                    <animate attributeName="opacity" values="0.12;1;0.22;0.12" dur="2.4s" begin="1.05s" repeatCount="indefinite"/>
                    <animate attributeName="r" values="5.5;8.5;6.2;5.5" dur="2.4s" begin="1.05s" repeatCount="indefinite"/>
                  </circle>

                  <circle cx="47.8" cy="150.6" r="6" fill="url(#dotGrad)" opacity="0.15">
                    <animate attributeName="opacity" values="0.12;1;0.22;0.12" dur="2.4s" begin="1.40s" repeatCount="indefinite"/>
                    <animate attributeName="r" values="5.5;8.5;6.2;5.5" dur="2.4s" begin="1.40s" repeatCount="indefinite"/>
                  </circle>
                </g>
              </svg>
            </div>

            <div class="note">A wish at the center. A circle around it. A score that earns trust.</div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    // Mobile-only star scaling (~10% smaller) without breaking alignment
    (function () {
      const mq = window.matchMedia("(max-width: 520px)");
      const star = document.getElementById("wishStar");
      if (!star) return;

      function apply() {
        if (mq.matches) {
          // scale around center (200,200)
          star.setAttribute("transform", "translate(200 200) scale(0.90) translate(-200 -200)");
        } else {
          star.removeAttribute("transform");
        }
      }
      apply();
      mq.addEventListener?.("change", apply);
    })();
  </script>
</body>
</html>
