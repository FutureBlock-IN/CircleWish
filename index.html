<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CircleWish — Coming Soon</title>

  <style>
    :root{
      --bg:#0A0F1C;
      --text:#F1F5FF;
      --muted:#AAB4D6;

      --orange:#F4511E;
      --blue:#4AA3C7;
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background:
        radial-gradient(900px 500px at 70% 20%, rgba(74,163,199,.25), transparent),
        radial-gradient(800px 500px at 30% 80%, rgba(244,81,30,.20), transparent),
        linear-gradient(180deg, #0A0F1C 0%, #0D1426 100%);
      color:var(--text);
    }

    .wrap{
      min-height:100%;
      display:grid;
      place-items:center;
      padding:20px;
    }

    .card{
      width:min(1100px,100%);
      border-radius:24px;
      padding:40px;
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.10);
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:28px;
      align-items:center;
      backdrop-filter: blur(14px);
    }

    h1{
      font-size:clamp(32px,4vw,46px);
      margin:0 0 10px;
    }

    .caption{
      color:rgba(241,245,255,.78);
      margin:0 0 18px;
      font-size:15px;
      max-width:32ch;
    }

    .pillRow{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-bottom:20px;
    }

    .pill{
      padding:10px 14px;
      border-radius:999px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      font-size:13px;
    }

    /* FORM */
    .formRow{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .emailInput{
      padding:12px 14px;
      border-radius:12px;
      border:none;
      width:260px;
      outline:none;
      font-size:14px;
      background:rgba(255,255,255,.92);
      color:#111;
    }

    .ctaBtn{
      padding:14px 22px;
      border:none;
      border-radius:14px;
      background:linear-gradient(
        135deg,
        #F4511E 0%,
        #E26A52 45%,
        #63B7DA 100%
      );
      color:white;
      font-weight:700;
      cursor:pointer;
      box-shadow:
        0 10px 28px rgba(74,163,199,.18),
        0 6px 18px rgba(244,81,30,.14);
      transition:.25s;
    }

    .ctaBtn:hover{
      transform:translateY(-2px);
      box-shadow:
        0 14px 34px rgba(74,163,199,.24),
        0 8px 22px rgba(244,81,30,.18);
    }

    /* LOGO */
    .logoWrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:12px;
    }

    .logo{
      width:100%;
      max-width:380px;
    }

    .tagline{
      font-size:13px;
      color:rgba(255,255,255,.75);
      text-align:center;
      letter-spacing:.2px;
    }

    .mobileOnly{display:none;}
    .desktopOnly{display:flex;}

    /* MOBILE */
    @media(max-width:900px){

      .card{
        grid-template-columns:1fr;
        text-align:center;
        padding:26px 18px;
        gap:14px;
      }

      .mobileOnly{
        display:flex;
      }

      .desktopOnly{
        display:none;
      }

      .logo{
        max-width:220px;
      }

      .tagline{
        max-width:18ch;
        line-height:1.4;
      }

      h1{
        font-size:34px;
      }

      .caption{
        max-width:20ch;
        margin:0 auto 14px;
      }

      .pillRow{
        justify-content:center;
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:10px;
      }

      .formRow{
        flex-direction:column;
        align-items:center;
      }

      .emailInput{
        width:100%;
        max-width:320px;
        font-size:16px;
      }

      .ctaBtn{
        width:240px;
      }
    }

  </style>
</head>

<body>
  <main class="wrap">

    <section class="card">

      <!-- MOBILE LOGO -->
      <div class="logoWrap mobileOnly">
        <img src="CWlogowithname.png" class="logo">

        <div class="tagline">
          Wish at the core. Circle around it. Proof in action.
        </div>
      </div>

      <!-- LEFT -->
      <div>

        <h1>Coming Soon</h1>

        <p class="caption">
          The platform for turning intent into impact.
        </p>

        <div class="pillRow">
          <div class="pill">Wishes</div>
          <div class="pill">Circles</div>
          <div class="pill">Trust & Score</div>
          <div class="pill">Proof of action</div>
        </div>

        <form action="https://formspree.io/f/xdapvykr" method="POST">

          <div class="formRow">
            <input 
              type="email" 
              name="email" 
              placeholder="Enter your email"
              required
              class="emailInput"
            >

            <button type="submit" class="ctaBtn">
              Get Early Access
            </button>
          </div>

          <input type="hidden" name="source" value="circlewish-coming-soon">

        </form>

      </div>

      <!-- DESKTOP LOGO -->
      <div class="logoWrap desktopOnly">
        <img src="CWlogowithname.png" class="logo">

        <div class="tagline">
          Wish at the core. Circle around it. Proof in action.
        </div>
      </div>

    </section>

  </main>
</body>
</html>
