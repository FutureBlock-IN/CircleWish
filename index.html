<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CircleWish — Coming Soon</title>

  <style>
    :root{
      --bg:#070A12;
      --text:#EAF0FF;
      --muted:rgba(234,240,255,.72);
      --ring:rgba(234,240,255,.22);
      --ringGlow: rgba(140,240,255,.14);
      --accent:#8CF0FF;
      --accent2:#B7A7FF;
    }

    *{box-sizing:border-box}
    html,body{
      height:100%;
      overflow-x:hidden; /* critical: prevent whole-page right-shift */
    }

    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background:
        radial-gradient(1200px 800px at 50% 35%, rgba(140,240,255,.08), transparent 55%),
        radial-gradient(900px 700px at 60% 65%, rgba(183,167,255,.10), transparent 55%),
        radial-gradient(700px 500px at 40% 60%, rgba(124,255,178,.06), transparent 60%),
        var(--bg);
      color:var(--text);
    }

    .wrap{
      min-height:100%;
      display:grid;
      place-items:center;
      padding:24px 16px;
      overflow-x:clip; /* even safer than hidden */
    }

    .card{
      width:min(980px, 100%);
      margin-inline:auto;
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.10);
      border-radius:22px;
      box-shadow: 0 24px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.10);
      overflow:hidden; /* contain glow + shadows */
    }

    .inner{
      display:grid;
      grid-template-columns: 1.05fr .95fr;
      gap:26px;
      padding:34px;
      align-items:center;
    }

    @media (max-width:860px){
      .inner{
        grid-template-columns:1fr;
        padding:26px;
        gap:18px;
        justify-items:center;
        text-align:center;
      }
    }

    .brand{
      display:flex; align-items:center; gap:10px;
      font-weight:700;
      margin-bottom:14px;
    }
    @media (max-width:860px){ .brand{justify-content:center;} }

    .dot{
      width:10px;height:10px;border-radius:999px;
      background:linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow:0 0 18px rgba(140,240,255,.4);
    }

    h1{
      margin:0 0 10px;
      font-size:clamp(26px,3.2vw,40px);
      letter-spacing:-.5px;
    }

    .caption{
      margin:0 0 14px;
      color:var(--muted);
      font-size:15px;
      max-width:54ch;
    }
    @media (max-width:860px){ .caption{margin-inline:auto;} }

    .pillRow{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin-top:12px;
      justify-content:flex-start;
    }
    @media (max-width:860px){ .pillRow{justify-content:center;} }

    @media (max-width:520px){
      .pillRow{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:10px;
        width:100%;
        justify-items:stretch;
      }
    }

    .pill{
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.04);
      padding:9px 14px;
      border-radius:999px;
      font-size:12px;
      color:rgba(234,240,255,.8);
      display:flex; align-items:center; gap:8px;
      backdrop-filter:blur(8px);
      justify-content:center;
      white-space:nowrap;
    }

    .mini{
      width:7px;height:7px;border-radius:999px;
      background:rgba(234,240,255,.55);
    }

    .hero{
      display:grid;
      place-items:center;
      width:100%;
    }

    .orbital{
      width:340px;
      aspect-ratio:1;
      position:relative;
      margin-inline:auto;
      overflow:visible;
    }
    @media (max-width:860px){
      .orbital{
        width:min(360px,88vw);
        margin-inline:auto;
      }
    }

    /* important: keep svg centered and prevent shadow overflow from shifting layout */
    .orbitSvg{
      width:100%;
      height:100%;
      display:block;
      margin-inline:auto;
      filter: drop-shadow(0 0 22px var(--ringGlow));
    }

    .note{
      margin-top:12px;
      font-size:12px;
      color:rgba(234,240,255,.55);
      text-align:center;
      max-width:46ch;
      margin-inline:auto;
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="card">
      <div class="inner">

        <!-- LEFT -->
        <div>
          <div class="brand">
            <span class="dot"></span>
            <span>CircleWish</span>
          </div>

          <h1>Coming Soon</h1>
          <p class="caption">The platform that turns intent into impact.</p>

          <div class="pillRow">
            <div class="pill"><span class="mini"></span>Wishes</div>
            <div class="pill"><span class="mini"></span>Circles</div>
            <div class="pill"><span class="mini"></span>Trust &amp; Score</div>
            <div class="pill"><span class="mini"></span>Proof of action</div>
          </div>
        </div>

        <!-- RIGHT -->
        <div class="hero">
          <div class="orbital">
            <svg class="orbitSvg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="dotGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="var(--accent)"/>
                  <stop offset="100%" stop-color="var(--accent2)"/>
                </linearGradient>
              </defs>

              <!-- Ring -->
              <circle cx="200" cy="200" r="160"
                      fill="none"
                      stroke="var(--ring)"
                      stroke-width="12"
                      opacity=".95"/>

              <!-- Star -->
              <path id="wishStar"
                d="M200 118
                   L226 170
                   L284 178
                   L242 218
                   L252 276
                   L200 250
                   L148 276
                   L158 218
                   L116 178
                   L174 170 Z"
                fill="rgba(236,248,255,.98)"
                style="
                  filter:
                    drop-shadow(0 0 22px rgba(140,240,255,.35))
                    drop-shadow(0 18px 30px rgba(0,0,0,.45));
                "/>

              <!-- Dots -->
              <g>
                <circle cx="200" cy="40" r="6" fill="url(#dotGrad)">
                  <animate attributeName="opacity" values=".2;1;.2" dur="2.4s" begin="0s" repeatCount="indefinite"/>
                </circle>
                <circle cx="352" cy="150" r="6" fill="url(#dotGrad)">
                  <animate attributeName="opacity" values=".2;1;.2" dur="2.4s" begin=".4s" repeatCount="indefinite"/>
                </circle>
                <circle cx="294" cy="330" r="6" fill="url(#dotGrad)">
                  <animate attributeName="opacity" values=".2;1;.2" dur="2.4s" begin=".8s" repeatCount="indefinite"/>
                </circle>
                <circle cx="106" cy="330" r="6" fill="url(#dotGrad)">
                  <animate attributeName="opacity" values=".2;1;.2" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
                </circle>
                <circle cx="48" cy="150" r="6" fill="url(#dotGrad)">
                  <animate attributeName="opacity" values=".2;1;.2" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
                </circle>
              </g>
            </svg>
          </div>

          <div class="note">
            A wish at the core. A circle around it. Proof of action.
          </div>
        </div>

      </div>
    </section>
  </main>
</body>
</html>
