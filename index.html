<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CircleWish — Coming Soon</title>

  <style>
    :root{
      --bg:#0A0F1C;
      --text:#F1F5FF;
      --muted:#AAB4D6;
      --orange:#F4511E;
      --blue:#4AA3C7;
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(900px 500px at 70% 20%, rgba(74,163,199,.25), transparent),
        radial-gradient(800px 500px at 30% 80%, rgba(244,81,30,.20), transparent),
        linear-gradient(180deg, #0A0F1C 0%, #0D1426 100%);
      color:var(--text);
    }

    .wrap{
      min-height:100%;
      display:grid;
      place-items:center;
      padding:24px;
    }

    .card{
      width:min(1100px,100%);
      border-radius:24px;
      padding:42px;
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.10);
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:30px;
      align-items:center;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    h1{
      font-size:clamp(32px,4vw,48px);
      margin:0 0 12px;
      line-height:1.05;
    }

    .caption{
      color:var(--muted);
      margin:0 0 20px;
      font-size:15px;
      line-height:1.45;
      max-width:34ch;
    }

    .pillRow{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-bottom:20px;
    }

    .pill{
      padding:10px 14px;
      border-radius:999px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      font-size:13px;
      line-height:1;
      white-space:nowrap;
    }

    .formRow{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .emailInput{
      padding:12px 14px;
      border-radius:10px;
      border:none;
      width:260px;
      outline:none;
      font-size:14px;
      background:rgba(255,255,255,.92);
      color:#111;
      box-shadow: inset 0 1px 3px rgba(0,0,0,.2);
    }

    .ctaBtn{
      padding:12px 20px;
      border:none;
      border-radius:10px;
      background:linear-gradient(135deg, #F4511E, #4AA3C7);
      color:#fff;
      font-weight:700;
      letter-spacing:.2px;
      cursor:pointer;
      box-shadow:0 10px 28px rgba(74,163,199,.28);
      transition:transform .25s ease, box-shadow .25s ease, filter .25s ease;
    }

    .ctaBtn:hover{
      transform:translateY(-2px) scale(1.02);
      box-shadow:0 14px 34px rgba(74,163,199,.40);
      filter:saturate(1.05);
    }

    .logoWrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:14px;
    }

    .logo{
      width:100%;
      max-width:420px;
      filter:drop-shadow(0 25px 50px rgba(0,0,0,.45));
      display:block;
    }

    .tagline{
      font-size:14px;
      color:rgba(255,255,255,.78);
      text-align:center;
      white-space:nowrap;
      line-height:1.35;
    }

    .mobileOnly{ display:none; }
    .desktopOnly{ display:flex; }

    @media (max-width:900px){
      .wrap{
        padding:18px 14px;
      }

      .card{
        grid-template-columns:1fr;
        text-align:center;
        padding:26px 18px 22px;
        gap:14px;
      }

      .mobileOnly{
        display:flex;
        margin-bottom:6px;
      }

      .desktopOnly{
        display:none;
      }

      .logo{
        max-width:230px;
      }

      .tagline{
        white-space:normal;
        max-width:18ch;
        font-size:13px;
      }

      h1{
        font-size:clamp(28px, 8vw, 40px);
        margin-bottom:10px;
      }

      .caption{
        margin:0 auto 16px;
        max-width:18ch;
        font-size:15px;
      }

      .pillRow{
        justify-content:center;
        display:grid;
        grid-template-columns:repeat(2, max-content);
        gap:10px 12px;
        margin-bottom:18px;
      }

      .formRow{
        flex-direction:column;
        align-items:center;
        gap:12px;
      }

      .emailInput{
        width:min(100%, 330px);
        font-size:16px;
        padding:14px 16px;
      }

      .ctaBtn{
        min-width:220px;
        padding:14px 22px;
        font-size:16px;
      }
    }

    @media (max-width:480px){
      .wrap{
        padding:14px 10px;
      }

      .card{
        border-radius:22px;
        padding:22px 14px 18px;
        gap:12px;
      }

      .logo{
        max-width:210px;
      }

      .tagline{
        max-width:19ch;
        font-size:12px;
      }

      h1{
        font-size:clamp(26px, 9vw, 34px);
      }

      .caption{
        font-size:14px;
        max-width:20ch;
      }

      .pill{
        font-size:12px;
        padding:10px 12px;
      }

      .pillRow{
        grid-template-columns:repeat(2, minmax(0, max-content));
        gap:10px;
      }

      .emailInput{
        width:100%;
        max-width:320px;
      }

      .ctaBtn{
        width:auto;
        min-width:210px;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="card">

      <!-- MOBILE LOGO -->
      <div class="logoWrap mobileOnly">
        <img src="CWlogowithname.png" alt="CircleWish Logo" class="logo" />
        <div class="tagline">
          A wish at the core. A circle around it. Proof of action.
        </div>
      </div>

      <!-- LEFT CONTENT -->
      <div>
        <h1>Coming Soon</h1>

        <p class="caption">
          The platform that turns intent into impact.
        </p>

        <div class="pillRow">
          <div class="pill">Wishes</div>
          <div class="pill">Circles</div>
          <div class="pill">Trust &amp; Score</div>
          <div class="pill">Proof of action</div>
        </div>

        <form action="https://formspree.io/f/yourFormID" method="POST">
          <div class="formRow">
            <input
              type="email"
              name="email"
              placeholder="Enter your email"
              required
              class="emailInput"
            />

            <button type="submit" class="ctaBtn">
              Start Your Circle
            </button>
          </div>

          <input type="hidden" name="source" value="circlewish-coming-soon" />
        </form>
      </div>

      <!-- DESKTOP LOGO -->
      <div class="logoWrap desktopOnly">
        <img src="CWlogowithname.png" alt="CircleWish Logo" class="logo" />
        <div class="tagline">
          A wish at the core. A circle around it. Proof of action.
        </div>
      </div>

    </section>
  </main>
</body>
</html>
