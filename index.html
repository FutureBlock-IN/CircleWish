<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CircleWish — Coming Soon</title>

  <style>
    :root{
      --bg:#070A12;
      --text:#EAF0FF;
      --muted:rgba(234,240,255,.72);
      --muted2:rgba(234,240,255,.58);

      --ring:rgba(234,240,255,.22);
      --ringGlow: rgba(140,240,255,.14);

      --accent:#8CF0FF;
      --accent2:#B7A7FF;
    }

    *{box-sizing:border-box}
    html,body{height:100%; overflow-x:hidden;}

    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background:
        radial-gradient(1200px 800px at 50% 35%, rgba(140,240,255,.08), transparent 55%),
        radial-gradient(900px 700px at 60% 65%, rgba(183,167,255,.10), transparent 55%),
        radial-gradient(700px 500px at 40% 60%, rgba(124,255,178,.06), transparent 60%),
        var(--bg);
      color:var(--text);
    }

    /* Center the whole card in the viewport */
    .wrap{
      min-height:100%;
      display:grid;
      place-items:center;
      padding:24px 14px;
      overflow-x:clip;
    }

    .card{
      width:min(980px, 100%);
      margin-inline:auto;
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.10);
      border-radius:22px;
      box-shadow: 0 24px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.10);
      overflow:hidden;
      position:relative;
      isolation:isolate; /* sheen stays contained */
    }

    /* Premium animated gradient sheen */
    .card::after{
      content:"";
      position:absolute;
      inset:-40%;
      background:
        linear-gradient(
          120deg,
          transparent 35%,
          rgba(140,240,255,.10) 50%,
          rgba(183,167,255,.08) 55%,
          transparent 70%
        );
      transform: translateX(-35%);
      animation: sheen 7.5s ease-in-out infinite;
      pointer-events:none;
      mix-blend-mode: screen;
      opacity:.55;
      z-index:0;
    }

    @keyframes sheen{
      0%   { transform: translateX(-45%); opacity:.30; }
      40%  { transform: translateX(15%);  opacity:.60; }
      100% { transform: translateX(55%);  opacity:.28; }
    }

    .inner{
      position:relative;
      z-index:1;
      display:grid;
      grid-template-columns: 1.05fr .95fr;
      gap:26px;
      padding:34px;
      align-items:center;
    }

    /* Mobile: true center layout */
    @media (max-width:860px){
      .inner{
        grid-template-columns:1fr;
        padding:26px 18px;
        gap:18px;
        justify-items:center;
        text-align:center;
      }
    }

    /* Brand lockup — boosted for mobile */
    .brand{
      display:flex; align-items:center; gap:10px;
      font-weight:750;
      margin-bottom:12px;
      justify-content:flex-start;
      font-size:16px;                 /* desktop baseline */
      letter-spacing:.2px;
      color:rgba(234,240,255,.92);
    }
    @media (max-width:860px){ .brand{justify-content:center;} }

    .dot{
      width:10px;height:10px;border-radius:999px;
      background:linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow:0 0 18px rgba(140,240,255,.40);
      flex:0 0 auto;
    }

    @media (max-width:520px){
      .brand{
        font-size:18px;               /* makes CircleWish feel branded */
        letter-spacing:.3px;
      }
      .dot{
        width:11px;
        height:11px;
      }
    }

    /* Headline: slightly less dominant on mobile */
    h1{
      margin:0 0 10px;
      font-size:clamp(26px,3.2vw,40px);
      letter-spacing:-.5px;
      line-height:1.05;
    }
    @media (max-width:520px){
      h1{
        font-size:32px;
        letter-spacing:-.4px;
      }
    }

    .caption{
      margin:0 0 14px;
      color:var(--muted);
      font-size:15px;
      max-width:54ch;
      margin-inline:auto;
      line-height:1.55;
    }

    /* Pills */
    .pillRow{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin-top:10px;
      justify-content:flex-start;
    }
    @media (max-width:860px){ .pillRow{justify-content:center;} }

    @media (max-width:520px){
      .pillRow{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:10px;
        width:100%;
        justify-items:stretch;
      }
    }

    .pill{
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.04);
      padding:10px 14px;
      border-radius:999px;
      font-size:12px;
      color:rgba(234,240,255,.82);
      display:flex; align-items:center; gap:8px;
      backdrop-filter:blur(8px);
      justify-content:center;
      white-space:nowrap;
    }

    .mini{
      width:7px;height:7px;border-radius:999px;
      background:rgba(234,240,255,.55);
      flex:0 0 auto;
    }

    /* Right visual block */
    .hero{
      display:grid;
      place-items:center;
      width:100%;
    }

    /* Reduce circle + star slightly on mobile */
    .orbital{
      width:340px;
      aspect-ratio:1;
      margin-inline:auto;
    }
    @media (max-width:520px){
      .orbital{
        width:min(300px, 84vw);
      }
    }

    .orbitSvg{
      width:100%;
      height:100%;
      display:block;
      margin-inline:auto;
      filter:drop-shadow(0 0 22px var(--ringGlow));
    }

    /* Bottom note: bigger + more modern */
    .note{
      margin-top:14px;
      font-size:13px;
      color:var(--muted2);
      text-align:center;
      max-width:48ch;
      margin-inline:auto;
      line-height:1.45;
      letter-spacing:.2px;
      font-weight:500;
    }
    @media (max-width:520px){
      .note{
        font-size:14px;
        line-height:1.5;
      }
    }

    /* Respect reduced motion */
    @media (prefers-reduced-motion: reduce){
      .card::after{ animation:none !important; opacity:.25; }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="card" role="region" aria-label="CircleWish coming soon">
      <div class="inner">

        <!-- LEFT -->
        <div>
          <div class="brand">
            <span class="dot" aria-hidden="true"></span>
            <span>CircleWish</span>
          </div>

          <h1>Coming Soon</h1>
          <p class="caption">The platform that turns intent into impact.</p>

          <div class="pillRow" aria-label="Key ideas">
            <div class="pill"><span class="mini"></span>Wishes</div>
            <div class="pill"><span class="mini"></span>Circles</div>
            <div class="pill"><span class="mini"></span>Trust &amp; Score</div>
            <div class="pill"><span class="mini"></span>Proof of action</div>
          </div>
        </div>

        <!-- RIGHT -->
        <div class="hero">
          <div class="orbital" aria-hidden="true">
            <svg class="orbitSvg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="dotGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="var(--accent)"/>
                  <stop offset="100%" stop-color="var(--accent2)"/>
                </linearGradient>
              </defs>

              <!-- Ring -->
              <circle cx="200" cy="200" r="160"
                      fill="none"
                      stroke="var(--ring)"
                      stroke-width="12"
                      opacity=".95"/>

              <!-- Star (Wish) with subtle tint + glow -->
              <path
                d="M200 118
                   L226 170
                   L284 178
                   L242 218
                   L252 276
                   L200 250
                   L148 276
                   L158 218
                   L116 178
                   L174 170 Z"
                fill="rgba(236,248,255,.98)"
                style="
                  filter:
                    drop-shadow(0 0 22px rgba(140,240,255,.35))
                    drop-shadow(0 18px 30px rgba(0,0,0,.45));
                "/>

              <!-- Dots (aligned to star tips) -->
              <g>
                <circle cx="200" cy="40" r="6" fill="url(#dotGrad)">
                  <animate attributeName="opacity" values=".2;1;.2" dur="2.4s" begin="0s" repeatCount="indefinite"/>
                </circle>
                <circle cx="352" cy="150" r="6" fill="url(#dotGrad)">
                  <animate attributeName="opacity" values=".2;1;.2" dur="2.4s" begin=".4s" repeatCount="indefinite"/>
                </circle>
                <circle cx="294" cy="330" r="6" fill="url(#dotGrad)">
                  <animate attributeName="opacity" values=".2;1;.2" dur="2.4s" begin=".8s" repeatCount="indefinite"/>
                </circle>
                <circle cx="106" cy="330" r="6" fill="url(#dotGrad)">
                  <animate attributeName="opacity" values=".2;1;.2" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
                </circle>
                <circle cx="48" cy="150" r="6" fill="url(#dotGrad)">
                  <animate attributeName="opacity" values=".2;1;.2" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
                </circle>
              </g>
            </svg>
          </div>

          <div class="note">
            A wish at the core. A circle around it. Proof of action.
          </div>
        </div>

      </div>
    </section>
  </main>
</body>
</html>
