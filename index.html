<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CircleWish — Coming Soon</title>

  <style>
    :root{
      --text:#F1F5FF;
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      font-family:ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(900px 500px at 70% 20%, rgba(74,163,199,.24), transparent),
        radial-gradient(800px 500px at 30% 80%, rgba(244,81,30,.18), transparent),
        linear-gradient(180deg, #09101d 0%, #0d1426 100%);
      color:var(--text);
    }

    .wrap{
      min-height:100%;
      display:grid;
      place-items:center;
      padding:20px;
    }

    .card{
      width:min(1200px,100%);
      border-radius:28px;
      padding:42px;
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.10);
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:30px;
      align-items:center;
      backdrop-filter:blur(14px);
      box-shadow:0 20px 60px rgba(0,0,0,.28);
      overflow:hidden;
    }

    h1{
      font-size:clamp(34px,5vw,64px);
      margin:0 0 10px;
    }

    .caption{
      color:rgba(241,245,255,.8);
      margin-bottom:20px;
    }

    .pillRow{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-bottom:24px;
    }

    .pill{
      padding:10px 16px;
      border-radius:999px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      font-size:14px;
    }

    .formRow{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
    }

    input{
      padding:14px;
      border-radius:12px;
      border:none;
      width:260px;
      font-size:16px;
    }

    button{
      padding:14px 22px;
      border:none;
      border-radius:14px;
      font-weight:700;
      cursor:pointer;
      background:linear-gradient(135deg,#F4511E,#66B8DA);
      color:white;
    }

    .logoWrap{
      text-align:center;
    }

    .logo{
      max-width:420px;
      width:100%;
    }

    .tagline{
      margin-top:14px;
      color:rgba(255,255,255,.8);
      font-size:15px;
    }

    @media(max-width:900px){
      .card{
        grid-template-columns:1fr;
        text-align:center;
      }

      .logo{
        max-width:220px;
      }

      input{
        width:100%;
      }

      button{
        width:220px;
      }

      .tagline{
        font-size:13px;
        line-height:1.6;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="card">

      <!-- LEFT -->
      <div>
        <h1>Coming Soon</h1>

        <p class="caption">
          The platform for turning intent into impact.
        </p>

        <div class="pillRow">
          <div class="pill">Wishes</div>
          <div class="pill">Circles</div>
          <div class="pill">Trust & Score</div>
          <div class="pill">Proof of action</div>
        </div>

        <form 
          action="https://formspree.io/f/xdapvykr" 
          method="POST"
          autocomplete="off"
        >
          <div class="formRow">
            <input 
              type="email" 
              name="email" 
              placeholder="Enter your email" 
              required
              autocomplete="off"
            />
            <button type="submit">Get Early Access</button>
          </div>

          <input type="hidden" name="_redirect" value="https://www.circlewish.com/thank-you.html">
        </form>
      </div>

      <!-- RIGHT -->
      <div class="logoWrap">
        <img src="CWlogowithname.png" class="logo" />

        <div class="tagline">
          A wish at the core. A circle around it.<br>
          Proof of action.
        </div>
      </div>

    </section>
  </main>
</body>
</html>
