<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CircleWish — Coming Soon</title>

  <style>
    :root{
      --bg:#0A0F1C;
      --text:#F1F5FF;
      --muted:#AAB4D6;

      --orange:#F4511E;
      --blue:#4AA3C7;
    }

    *{box-sizing:border-box}
    html,body{height:100%;}

    body{
      margin:0;
      font-family: ui-sans-serif, system-ui;

      background:
        radial-gradient(900px 500px at 70% 20%, rgba(74,163,199,.25), transparent),
        radial-gradient(800px 500px at 30% 80%, rgba(244,81,30,.20), transparent),
        linear-gradient(180deg, #0A0F1C 0%, #0D1426 100%);

      color:var(--text);
    }

    .wrap{
      min-height:100%;
      display:grid;
      place-items:center;
      padding:24px;
    }

    .card{
      width:min(1100px,100%);
      border-radius:24px;
      padding:42px;

      background:linear-gradient(
        180deg,
        rgba(255,255,255,.06),
        rgba(255,255,255,.02)
      );

      border:1px solid rgba(255,255,255,.10);

      display:grid;
      grid-template-columns:1fr 1fr;
      gap:30px;
      align-items:center;

      backdrop-filter: blur(14px);
    }

    @media(max-width:900px){
      .card{
        grid-template-columns:1fr;
        text-align:center;
      }
    }

    h1{
      font-size:clamp(32px,4vw,48px);
      margin:0 0 12px;
    }

    .caption{
      color:var(--muted);
      margin-bottom:20px;
    }

    .pillRow{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-bottom:20px;
    }

    @media(max-width:900px){
      .pillRow{
        justify-content:center;
      }
    }

    .pill{
      padding:10px 14px;
      border-radius:999px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      font-size:13px;
    }

    /* FORM */
    .formRow{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    @media(max-width:600px){
      .formRow{
        flex-direction:column;
        align-items:center;
      }
    }

    .emailInput{
      padding:12px 14px;
      border-radius:10px;
      border:none;
      width:260px;
      outline:none;
      font-size:14px;

      background:rgba(255,255,255,.9);
      color:#111;

      box-shadow: inset 0 1px 3px rgba(0,0,0,.2);
    }

    .ctaBtn{
      padding:12px 20px;
      border:none;
      border-radius:10px;

      background: linear-gradient(135deg, #F4511E, #4AA3C7);
      color:white;

      font-weight:600;
      letter-spacing:.2px;
      cursor:pointer;

      box-shadow: 0 6px 20px rgba(74,163,199,.35);
      transition: all .25s ease;
    }

    .ctaBtn:hover{
      transform:translateY(-2px) scale(1.02);
      box-shadow: 0 10px 30px rgba(74,163,199,.5);
    }

    /* LOGO */
    .logoWrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:16px;
    }

    .logo{
      width:100%;
      max-width:420px;
      filter: drop-shadow(0 25px 50px rgba(0,0,0,.5));
    }

    @media(max-width:600px){
      .logo{
        max-width:240px;
      }
    }

    .tagline{
      font-size:14px;
      color:rgba(255,255,255,.75);
      text-align:center;
      white-space:nowrap;
    }

    @media(max-width:600px){
      .tagline{
        white-space:normal;
        font-size:13px;
      }
    }

    /* MOBILE VS DESKTOP LOGO CONTROL */
    .mobileOnly{
      display:none;
    }

    .desktopOnly{
      display:flex;
    }

    @media(max-width:900px){
      .mobileOnly{
        display:flex;
        margin-bottom:20px;
      }

      .desktopOnly{
        display:none;
      }
    }

  </style>
</head>

<body>
  <main class="wrap">

    <section class="card">

      <!-- MOBILE LOGO -->
      <div class="logoWrap mobileOnly">
        <img src="CWlogowithname.png" alt="CircleWish Logo" class="logo">

        <div class="tagline">
          A wish at the core. A circle around it. Proof of action.
        </div>
      </div>

      <!-- LEFT -->
      <div>
        <h1>Coming Soon</h1>

        <p class="caption">
          The platform that turns intent into impact.
        </p>

        <div class="pillRow">
          <div class="pill">Wishes</div>
          <div class="pill">Circles</div>
          <div class="pill">Trust & Score</div>
          <div class="pill">Proof of action</div>
        </div>

        <!-- EMAIL FORM -->
        <form action="https://formspree.io/f/xdapvykr" method="POST">

          <div class="formRow">

            <input 
              type="email" 
              name="email" 
              placeholder="Enter your email"
              required
              class="emailInput"
            >

            <button type="submit" class="ctaBtn">
              Start Your Circle
            </button>

          </div>

          <input type="hidden" name="source" value="circlewish-coming-soon">

        </form>

      </div>

      <!-- DESKTOP LOGO -->
      <div class="logoWrap desktopOnly">
        <img src="CWlogowithname.png" alt="CircleWish Logo" class="logo">

        <div class="tagline">
          A wish at the core. A circle around it. Proof of action.
        </div>
      </div>

    </section>

  </main>
</body>
</html>
