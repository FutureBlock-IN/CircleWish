<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CircleWish — Coming Soon</title>

  <style>
    :root{
      --bg:#0A0F1C;
      --text:#F1F5FF;
      --muted:#AAB4D6;
      --orange:#F4511E;
      --blue:#4AA3C7;
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(900px 500px at 70% 20%, rgba(74,163,199,.24), transparent),
        radial-gradient(800px 500px at 30% 80%, rgba(244,81,30,.18), transparent),
        linear-gradient(180deg, #09101d 0%, #0d1426 100%);
      color:var(--text);
    }

    .wrap{
      min-height:100%;
      display:grid;
      place-items:center;
      padding:20px;
    }

    .card{
      width:min(1200px,100%);
      border-radius:28px;
      padding:42px;
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.10);
      display:grid;
      grid-template-columns:1.08fr .92fr;
      gap:34px;
      align-items:center;
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      box-shadow:0 20px 60px rgba(0,0,0,.28);
    }

    .content{
      max-width:560px;
    }

    h1{
      font-size:clamp(32px,4vw,64px);
      margin:0 0 12px;
      line-height:1.02;
      letter-spacing:-0.03em;
    }

    .caption{
      color:rgba(241,245,255,.80);
      margin:0 0 24px;
      font-size:18px;
      line-height:1.45;
      white-space:nowrap;
    }

    .pillRow{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin-bottom:26px;
    }

    .pill{
      padding:11px 16px;
      border-radius:999px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      font-size:14px;
      white-space:nowrap;
      color:rgba(241,245,255,.92);
    }

    .formRow{
      display:flex;
      gap:12px;
      flex-wrap:nowrap;
      align-items:center;
    }

    .emailInput{
      padding:14px 16px;
      border-radius:14px;
      border:none;
      width:100%;
      min-width:0;
      max-width:320px;
      outline:none;
      font-size:16px;
      background:rgba(255,255,255,.95);
      color:#111;
      box-shadow:inset 0 1px 2px rgba(0,0,0,.12);
    }

    .ctaBtn{
      padding:15px 24px;
      border:none;
      border-radius:16px;
      background:linear-gradient(135deg, #F4511E 0%, #DD765E 48%, #66B8DA 100%);
      color:#fff;
      font-weight:700;
      font-size:16px;
      cursor:pointer;
      white-space:nowrap;
      box-shadow:
        0 10px 24px rgba(74,163,199,.16),
        0 6px 18px rgba(244,81,30,.12);
      transition:transform .22s ease, box-shadow .22s ease, filter .22s ease;
    }

    .ctaBtn:hover{
      transform:translateY(-2px);
      box-shadow:
        0 14px 32px rgba(74,163,199,.22),
        0 8px 22px rgba(244,81,30,.16);
      filter:saturate(1.03);
    }

    .logoWrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:6px;
      text-align:center;
    }

    .logo{
      width:100%;
      max-width:500px;
      display:block;
    }

    .tagline{
      font-size:15px;
      color:rgba(255,255,255,.78);
      line-height:1.45;
      max-width:22ch;
      margin-top:-6px;
      text-align:center;
      transform:translateX(-6px);
      text-wrap:balance;
    }

    .mobileOnly{display:none;}
    .desktopOnly{display:flex;}

    @media (max-width:900px){
      .card{
        grid-template-columns:1fr;
        text-align:center;
        padding:26px 18px;
        gap:14px;
      }

      .mobileOnly{display:flex;}
      .desktopOnly{display:none;}

      .content{
        max-width:none;
      }

      .logo{
        max-width:220px;
      }

      .tagline{
        transform:none;
        margin-top:0;
        max-width:18ch;
        font-size:13px;
        line-height:1.6;
      }

      h1{
        font-size:34px;
      }

      .caption{
        max-width:22ch;
        white-space:normal;
        margin:0 auto 14px;
        font-size:15px;
        line-height:1.5;
      }

      .pillRow{
        justify-content:center;
        display:grid;
        grid-template-columns:repeat(2, max-content);
        gap:10px 12px;
        margin-bottom:20px;
      }

      .pill{
        font-size:13px;
        padding:10px 14px;
      }

      .formRow{
        flex-direction:column;
        align-items:center;
        gap:12px;
      }

      .emailInput{
        max-width:320px;
        width:100%;
        font-size:16px;
        padding:14px 16px;
      }

      .ctaBtn{
        width:240px;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="card">

      <!-- MOBILE LOGO -->
      <div class="logoWrap mobileOnly">
        <img src="CWlogowithname.png" alt="CircleWish Logo" class="logo" />
        <div class="tagline">
          A wish at the core.<br>
          A circle around it.<br>
          Proof in action.
        </div>
      </div>

      <!-- LEFT -->
      <div class="content">
        <h1>Coming Soon</h1>

        <p class="caption">
          The platform for turning intent into impact.
        </p>

        <div class="pillRow">
          <div class="pill">Wishes</div>
          <div class="pill">Circles</div>
          <div class="pill">Trust &amp; Score</div>
          <div class="pill">Proof of action</div>
        </div>

        <form action="https://formspree.io/f/xdapvykr" method="POST">
          <div class="formRow">
            <input
              type="email"
              name="email"
              placeholder="Enter your email"
              required
              class="emailInput"
            />
            <button type="submit" class="ctaBtn">
              Get Early Access
            </button>
          </div>

          <input type="hidden" name="source" value="circlewish-coming-soon" />
        </form>
      </div>

      <!-- DESKTOP LOGO -->
      <div class="logoWrap desktopOnly">
        <img src="CWlogowithname.png" alt="CircleWish Logo" class="logo" />
        <div class="tagline">
          A wish at the core. A circle around it. Proof in action.
        </div>
      </div>

    </section>
  </main>
</body>
</html>
